services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skillswap-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.example
    environment:
      NODE_ENV: dev
      APP_PORT: 3000
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: db
      DATABASE_USERNAME: db
      DATABASE_PASSWORD: postgres
    ports:
      - '3000:3000'
    volumes:
      - backend_uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - skillswap-network

  db:
    image: postgres:17-alpine
    container_name: skillswap-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: db
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U db -d db']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - skillswap-network

volumes:
  backend_uploads:
  postgres_data:

networks:
  skillswap-network:
    driver: bridge
